name: Terraform Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, pipeline-lab]

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        run: terraform init -backend-config=backends/dev.hcl -reconfigure
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var="ministack_endpoint=http://ministack-dev:4566"
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Create k3d cluster
        working-directory: ${{ github.workspace }}
        run: |
          k3d cluster delete pipeline-lab 2>/dev/null || true
          k3d cluster create pipeline-lab --agents 1 -p "80:80@loadbalancer" --wait --network pipeline-lab_pipeline-net

      - name: Configure kubeconfig
        working-directory: ${{ github.workspace }}
        run: |
          export KUBECONFIG=$(k3d kubeconfig write pipeline-lab)
          SERVER_IP=$(docker inspect k3d-pipeline-lab-server-0 --format='{{json .NetworkSettings.Networks}}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('pipeline-lab_pipeline-net',{}).get('IPAddress',''))")
          sed -i "s|https://0.0.0.0:[0-9]*|https://${SERVER_IP}:6443|" $KUBECONFIG
          echo "KUBECONFIG=$KUBECONFIG" >> $GITHUB_ENV
          kubectl get nodes

      - name: Build container images
        working-directory: ${{ github.workspace }}
        run: |
          docker build -t votes:latest ./app/votes
          docker build -t results:latest ./app/results

      - name: Import images into k3d
        working-directory: ${{ github.workspace }}
        run: k3d image import votes:latest results:latest -c pipeline-lab

      - name: Deploy with Helm
        working-directory: ${{ github.workspace }}
        run: |
          helm upgrade --install vote-app ./charts/vote-app \
            --create-namespace \
            -n vote-app \
            -f ./charts/vote-app/values/dev.yaml

      - name: Wait for deployments
        working-directory: ${{ github.workspace }}
        run: |
          kubectl wait --for=condition=available deployment --all -n vote-app --timeout=180s

      - name: Debug pod status on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Pods ==="
          kubectl get pods -n vote-app -o wide || true
          echo "=== Events ==="
          kubectl get events -n vote-app --sort-by='.lastTimestamp' || true
          echo "=== Describe votes ==="
          kubectl describe deployment vote-app-votes -n vote-app || true
          echo "=== Describe results ==="
          kubectl describe deployment vote-app-results -n vote-app || true
          echo "=== Logs votes ==="
          kubectl logs -n vote-app -l app.kubernetes.io/component=votes --tail=50 || true
          echo "=== Logs results ==="
          kubectl logs -n vote-app -l app.kubernetes.io/component=results --tail=50 || true

      - name: Integration test
        working-directory: ${{ github.workspace }}
        run: |
          kubectl port-forward -n vote-app svc/vote-app-votes 8080:8080 &
          PF1=$!
          kubectl port-forward -n vote-app svc/vote-app-results 8081:8081 &
          PF2=$!
          sleep 5
          curl -sf -X POST http://localhost:8080/vote -H 'Content-Type: application/json' -d '{"option":"a"}'
          curl -sf http://localhost:8081/results
          kill $PF1 $PF2

      - name: Destroy k3d cluster
        if: always()
        working-directory: ${{ github.workspace }}
        run: k3d cluster delete pipeline-lab
