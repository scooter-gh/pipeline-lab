services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    environment:
      PERSIST_STATE: 1
      STATE_DIR: /data/ministack-state
      DOCKER_NETWORK: pipeline-net
      CLOUDTRAIL_RECORDING: 1
    volumes:
      - ./ministack-data:/data
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  ministack-dev:
    image: ministackorg/ministack:latest
    ports:
      - "4567:4566"
    environment:
      PERSIST_STATE: 1
      STATE_DIR: /data/ministack-state-dev
      DOCKER_NETWORK: pipeline-net
      CLOUDTRAIL_RECORDING: 1
    volumes:
      - ./ministack-data-dev:/data
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  ministack-ui:
    image: davireis/stackport:latest
    depends_on:
      ministack:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    networks:
      - pipeline-net

  ministack-ui-dev:
    image: davireis/stackport:latest
    depends_on:
      ministack-dev:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      AWS_ENDPOINT_URL: http://ministack-dev:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    networks:
      - pipeline-net

  github-runner:
    build: ./runner
    depends_on:
      ministack:
        condition: service_healthy
    environment:
      RUNNER_NAME: pipeline-lab-runner
      REPO_URL: https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}
      RUNNER_TOKEN: ${GITHUB_RUNNER_TOKEN}
      RUNNER_WORKDIR: /tmp/runner-work
      LABELS: self-hosted,linux,pipeline-lab
      DISABLE_AUTO_UPDATE: "true"
    volumes:
      - ./runner/.runner-data:/home/runner/.runner-data
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge