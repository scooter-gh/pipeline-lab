apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-votes
  labels:
    {{- include "vote-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: votes
spec:
  replicas: {{ .Values.votes.replicas }}
  selector:
    matchLabels:
      {{- include "vote-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: votes
  template:
    metadata:
      labels:
        {{- include "vote-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: votes
    spec:
      containers:
        - name: votes
          image: {{ .Values.votes.image }}:{{ .Values.votes.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.votes.port }}
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.votes.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.votes.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.votes.resources | nindent 12 }}
---
