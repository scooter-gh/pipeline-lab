apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}
  labels:
    {{- include "vote-app.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /vote
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-votes
                port:
                  number: {{ .Values.votes.port }}
          - path: /results
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-results
                port:
                  number: {{ .Values.results.port }}
